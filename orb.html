<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Living Orb</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  canvas {
    display: block;
  }
  .back {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    text-decoration: none;
    font-family: system-ui, sans-serif;
    opacity: 0.7;
  }
</style>
</head>

<body>
<a href="index.html" class="back">← Back</a>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

let time = 0;

const sparkles = Array.from({ length: 250 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2 + 1,
  a: Math.random(),
  vx: (Math.random() - 0.5) * 0.4,
  vy: (Math.random() - 0.5) * 0.4
}));

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  g.addColorStop(0, `hsl(${time * 20 % 360}, 90%, 50%)`);
  g.addColorStop(1, `hsl(${(time * 20 + 180) % 360}, 90%, 40%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawSparkles() {
  for (let s of sparkles) {
    s.x += s.vx;
    s.y += s.vy;

    if (s.x < 0) s.x = canvas.width;
    if (s.x > canvas.width) s.x = 0;
    if (s.y < 0) s.y = canvas.height;
    if (s.y > canvas.height) s.y = 0;

    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawOrb() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);

  const baseRadius = Math.min(canvas.width, canvas.height) * 0.18;
  const pulse = Math.sin(time * 2) * 20;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();

  const points = 100;
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const noise =
      Math.sin(angle * 4 + time * 3) * 25 +
      Math.sin(angle * 7 - time * 2) * 15;

    const attraction = Math.max(0, 1 - dist / 500);
    const r = baseRadius + pulse + noise * attraction;

    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.closePath();

  const glow = ctx.createRadialGradient(0, 0, 50, 0, 0, baseRadius * 1.3);
  glow.addColorStop(0, `hsla(${time * 60 % 360}, 100%, 70%, 1)`);
  glow.addColorStop(1, `hsla(${(time * 60 + 120) % 360}, 100%, 40%, 0.2)`);

  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = glow;
  ctx.shadowBlur = 60;
  ctx.shadowColor = "white";
  ctx.fill();
  ctx.restore();

  ctx.globalCompositeOperation = "source-over";
}

function animate() {
  time += 0.01;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawSparkles();
  drawOrb();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
